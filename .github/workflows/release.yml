name: Build & Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build APK (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>&1)
          echo "$OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | python3 -c "import sys,re; s=sys.stdin.read(); m=re.search(r'\b[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\b', s); print(m.group(0) if m else '')")
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Get APK download URL
        id: apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          OUTPUT=$(eas build:view "$BUILD_ID" --json --non-interactive 2>&1)
          echo "$OUTPUT"
          APK_URL=$(echo "$OUTPUT" | python3 -c "import sys,re; s=sys.stdin.read(); m=re.search(r'applicationArchiveUrl\":\s*\"([^\"]+)\"', s); print(m.group(1) if m and m.group(1) else '')")
          echo "url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o vestoram.apk "${{ steps.apk.outputs.url }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vestoram ${{ github.ref_name }}
          files: vestoram.apk
          generate_release_notes: true
          draft: false
          prerelease: false
