name: Build & Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build APK (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK download URL
        id: apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
          APK_URL=$(eas build:view "$BUILD_ID" --json --non-interactive | jq -r '.artifacts.applicationArchiveUrl')
          echo "url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o vestoram.apk "${{ steps.apk.outputs.url }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vestoram ${{ github.ref_name }}
          files: vestoram.apk
          generate_release_notes: true
          draft: false
          prerelease: false
