name: Build APK (local, no EAS limit)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version (ex: v1.0.2) — utilisé pour renommer l'APK"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hmerritt/android-sdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (regen android/)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode keystore (si configuré)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/vestoram.keystore
            echo "Keystore décodé"
            ls -lh android/app/vestoram.keystore
          else
            echo "Pas de keystore secret → build debug (non signé release)"
          fi

      - name: Inject signing config
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<'EOF'
          MYAPP_RELEASE_STORE_FILE=vestoram.keystore
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "gradle.properties injecté"

      - name: Build APK (Gradle)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          TAG="${{ inputs.version || github.ref_name }}"
          # fallback si workflow_dispatch sans tag
          if [ -z "$TAG" ] || [ "$TAG" = "" ]; then TAG="v1.0.1"; fi
          APK_DST="vestoram-${TAG}.apk"
          cp "$APK_SRC" "$APK_DST"
          cp "$APK_SRC" vestoram.apk
          ls -lh vestoram*.apk
          echo "apk_path=$APK_DST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestoram-apk
          path: |
            vestoram.apk
            vestoram-v*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vestoram ${{ github.ref_name }}
          files: vestoram.apk
          generate_release_notes: true
          draft: false
          prerelease: false
